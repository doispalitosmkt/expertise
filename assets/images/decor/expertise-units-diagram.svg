<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" role="img" aria-labelledby="title desc">
  <title id="title">Integração das quatro unidades de negócio da Expertise</title>
  <desc id="desc">Quatro círculos grafite sobrepostos formam pétalas amarelas que representam a atuação integrada de Eventos, Trade, Incentivo e Viagem de incentivo e Logística.</desc>
  <defs>
    <clipPath id="circle-top"><circle cx="300" cy="160" r="145"/></clipPath>
    <clipPath id="circle-bottom"><circle cx="300" cy="410" r="145"/></clipPath>
  </defs>
  <g fill="#202020" fill-opacity=".18" stroke="#000" stroke-opacity=".5" stroke-width="2">
    <circle cx="300" cy="160" r="145"/>
    <circle cx="175" cy="285" r="145"/>
    <circle cx="425" cy="285" r="145"/>
    <circle cx="300" cy="410" r="145"/>
  </g>
  <g fill="#ffe600" fill-opacity=".86">
    <circle cx="175" cy="285" r="145" clip-path="url(#circle-top)"/>
    <circle cx="425" cy="285" r="145" clip-path="url(#circle-top)"/>
    <circle cx="175" cy="285" r="145" clip-path="url(#circle-bottom)"/>
    <circle cx="425" cy="285" r="145" clip-path="url(#circle-bottom)"/>
  </g>
</svg>
